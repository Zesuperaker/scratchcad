# Configuration for `cargo about`, which generates the Rust section of
# ../THIRD_PARTY_LICENSES.txt; see ../scripts/third_party_licenses.py.
# Generation fails if a dependency uses a license not listed here, so a new
# license (e.g. GPL) gets a deliberate review before it ships.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
# Platforms vibecad is built for: the Docker images, and native builds.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
