name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --fail-under-lines 90 --summary-only

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    env:
      # The integration tests run the MCP server against this real binary.
      SCRATCHCAD_BIN: ${{ github.workspace }}/server/target/release/scratchcad
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --locked
        working-directory: server
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  dev-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      # Builds the compose services with layers cached in the GitHub Actions
      # cache, so only layers whose inputs changed are rebuilt. mode=max also
      # keeps the dependency-only layers, so a source change reuses them.
      - uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          set: |
            server.cache-from=type=gha,scope=dev-server
            server.cache-to=type=gha,scope=dev-server,mode=max
            mcp.cache-from=type=gha,scope=dev-mcp
            mcp.cache-to=type=gha,scope=dev-mcp,mode=max
