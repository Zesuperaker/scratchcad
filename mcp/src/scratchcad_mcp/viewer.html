<!doctype html>
<!--
  STL viewer served by the MCP server at GET /viewer (HTTP mode only).
  Lists the files export_stl wrote (GET /viewer/files) and shows one with
  three.js, which is loaded from jsDelivr so there is nothing to build.
  The list is polled, so new and overwritten exports appear on their own.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scratchcad viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5;
    --panel: #ffffff;
    --text: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --accent: #2563eb;
    --selected: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --panel: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #3f3f46;
      --accent: #60a5fa;
      --selected: #1e3a5f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: 280px 1fr;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
  }
  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  h1 { margin: 0 0 8px; font-size: 16px; }
  label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  ul { flex: 1; margin: 0; padding: 4px 0; overflow-y: auto; list-style: none; }
  li button {
    display: block;
    width: 100%;
    padding: 6px 16px;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  li button:hover { background: var(--bg); }
  li button[aria-current="true"] { background: var(--selected); }
  .name { display: block; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12px; }
  .empty { padding: 12px 16px; color: var(--muted); }
  main { position: relative; min-width: 0; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #viewcube {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 120px;
    height: 120px;
  }
  #toolbar {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: flex;
    gap: 8px;
  }
  #toolbar button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  #toolbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #info {
    position: absolute;
    left: 12px;
    bottom: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--panel);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: pre;
  }
  #info:empty { display: none; }
  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
</script>
</head>
<body>
<aside>
  <header>
    <h1>scratchcad viewer</h1>
    <label><input id="follow" type="checkbox" checked> Show newest export</label>
  </header>
  <ul id="files"></ul>
</aside>
<main>
  <canvas id="view"></canvas>
  <canvas id="viewcube" title="Click a face, edge or corner to look from that side"></canvas>
  <div id="toolbar">
    <button id="wireframe" type="button" aria-pressed="false">Wireframe</button>
    <button id="reset" type="button">Reset view</button>
  </div>
  <div id="info"></div>
</main>
<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { STLLoader } from "three/addons/loaders/STLLoader.js";
  import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";

  const POLL_MS = 2000;
  // Edges sharper than this stay sharp; gentler ones are smoothed, which
  // hides the faceting of meshed curved surfaces.
  const CREASE_ANGLE = THREE.MathUtils.degToRad(30);

  const canvas = document.getElementById("view");
  const list = document.getElementById("files");
  const follow = document.getElementById("follow");
  const info = document.getElementById("info");
  const wireframeButton = document.getElementById("wireframe");

  // --- scene -----------------------------------------------------------------

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);

  const scene = new THREE.Scene();
  // Same convention as render_3d: +y is up.
  const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
  camera.position.set(1, 1, 2);
  scene.add(camera);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8888aa, 1.6));
  const headlight = new THREE.DirectionalLight(0xffffff, 1.6);
  headlight.position.set(0.5, 1, 1);
  camera.add(headlight);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;

  const material = new THREE.MeshStandardMaterial({
    color: 0x9aa7b8,
    metalness: 0.1,
    roughness: 0.6,
  });
  let mesh = null;
  let grid = null;

  function resize() {
    const { clientWidth: width, clientHeight: height } = canvas;
    if (canvas.width !== Math.round(width * renderer.getPixelRatio()) ||
        canvas.height !== Math.round(height * renderer.getPixelRatio())) {
      renderer.setSize(width, height, false);
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
    }
  }

  renderer.setAnimationLoop(() => {
    resize();
    if (turn) stepTurn(performance.now());
    else controls.update();
    renderer.render(scene, camera);
    renderViewCube();
  });

  function frame() {
    turn = null;
    if (!mesh) return;
    const box = mesh.geometry.boundingBox;
    const center = box.getCenter(new THREE.Vector3());
    const radius = box.getBoundingSphere(new THREE.Sphere()).radius || 1;
    const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2));
    const direction = new THREE.Vector3(0.6, 0.45, 1).normalize();
    camera.position.copy(center).addScaledVector(direction, distance * 1.1);
    camera.near = distance / 100;
    camera.far = distance * 100;
    camera.updateProjectionMatrix();
    controls.target.copy(center);
    controls.update();
  }

  function show(geometry, refit) {
    geometry.computeBoundingBox();
    if (mesh) {
      mesh.geometry.dispose();
      scene.remove(mesh);
    }
    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const box = geometry.boundingBox;
    const size = box.getSize(new THREE.Vector3());
    if (grid) {
      grid.geometry.dispose();
      scene.remove(grid);
    }
    const extent = Math.max(size.x, size.z, 1e-6) * 2;
    grid = new THREE.GridHelper(extent, 20, 0x888888, 0x888888);
    grid.material.opacity = 0.25;
    grid.material.transparent = true;
    grid.position.set((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2);
    scene.add(grid);

    const triangles = geometry.attributes.position.count / 3;
    const fmt = (n) => Number(n.toPrecision(4)).toString();
    info.textContent =
      `${triangles.toLocaleString()} triangles\n` +
      `size ${fmt(size.x)} × ${fmt(size.y)} × ${fmt(size.z)}`;
    if (refit) frame();
  }

  // --- view cube -------------------------------------------------------------
  // A labelled cube that turns with the camera. Clicking a face, edge or
  // corner swings the camera round the target to look from that side.

  const cubeCanvas = document.getElementById("viewcube");
  const cubeRenderer = new THREE.WebGLRenderer({ canvas: cubeCanvas, antialias: true, alpha: true });
  cubeRenderer.setPixelRatio(window.devicePixelRatio);
  cubeRenderer.setSize(cubeCanvas.clientWidth, cubeCanvas.clientHeight, false);
  const cubeScene = new THREE.Scene();
  const cubeCamera = new THREE.OrthographicCamera(-2.2, 2.2, 2.2, -2.2, 0.1, 20);
  cubeScene.add(cubeCamera);
  cubeScene.add(new THREE.AmbientLight(0xffffff, 2));
  const cubeLight = new THREE.DirectionalLight(0xffffff, 1.2);
  cubeLight.position.set(0.5, 1, 1);
  cubeCamera.add(cubeLight);

  function faceTexture(label) {
    const size = 128;
    const face = document.createElement("canvas");
    face.width = face.height = size;
    const g = face.getContext("2d");
    g.fillStyle = "#e4e4e7";
    g.fillRect(0, 0, size, size);
    g.strokeStyle = "#a1a1aa";
    g.lineWidth = 6;
    g.strokeRect(3, 3, size - 6, size - 6);
    g.fillStyle = "#3f3f46";
    g.font = "600 28px system-ui, sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(label, size / 2, size / 2);
    const texture = new THREE.CanvasTexture(face);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = 4;
    return texture;
  }

  // BoxGeometry's face order is +x, -x, +y, -y, +z, -z. Front is +z because
  // render_3d's unrotated camera looks along -z.
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(2, 2, 2),
    ["Right", "Left", "Top", "Bottom", "Front", "Back"].map(
      (label) => new THREE.MeshLambertMaterial({ map: faceTexture(label) }),
    ),
  );
  cubeScene.add(cube);
  cubeScene.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(cube.geometry),
    new THREE.LineBasicMaterial({ color: 0x71717a }),
  ));
  const corner = new THREE.Vector3(-1.08, -1.08, -1.08);
  for (const [axis, color] of [[[1, 0, 0], 0xef4444], [[0, 1, 0], 0x22c55e], [[0, 0, 1], 0x3b82f6]]) {
    cubeScene.add(new THREE.ArrowHelper(new THREE.Vector3(...axis), corner, 2.8, color, 0.35, 0.2));
  }

  const highlight = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0x2563eb, transparent: true, opacity: 0.45, depthWrite: false }),
  );
  highlight.visible = false;
  cubeScene.add(highlight);

  // Where a point on the cube's surface looks from: its face, plus the
  // neighbouring face(s) when it is near an edge or corner. (1, 0, 0) is the
  // Right face, (1, 1, 0) the top-right edge, (1, 1, 1) a corner.
  function regionAt(point) {
    return new THREE.Vector3(
      ...point.toArray().map((c) => (Math.abs(c) > 0.6 ? Math.sign(c) : 0)),
    );
  }

  const raycaster = new THREE.Raycaster();
  function pick(event) {
    const rect = cubeCanvas.getBoundingClientRect();
    const pointer = new THREE.Vector2(
      ((event.clientX - rect.left) / rect.width) * 2 - 1,
      -((event.clientY - rect.top) / rect.height) * 2 + 1,
    );
    raycaster.setFromCamera(pointer, cubeCamera);
    const [hit] = raycaster.intersectObject(cube);
    return hit ? regionAt(hit.point) : null;
  }

  function showHighlight(region) {
    highlight.visible = region !== null;
    cubeCanvas.style.cursor = region ? "pointer" : "";
    if (!region) return;
    // Faces span ±0.6 of the side; edges and corners the 0.4 beyond that.
    // Each piece sits slightly proud of the cube so it isn't hidden by it.
    const size = region.toArray().map((r) => (r === 0 ? 1.2 : 0.44));
    const center = region.toArray().map((r) => r * 0.82);
    highlight.scale.set(...size);
    highlight.position.set(...center);
  }

  cubeCanvas.addEventListener("pointermove", (event) => showHighlight(pick(event)));
  cubeCanvas.addEventListener("pointerleave", () => showHighlight(null));
  cubeCanvas.addEventListener("click", (event) => {
    const region = pick(event);
    if (region) lookFrom(region);
  });

  function renderViewCube() {
    cubeCamera.quaternion.copy(camera.quaternion);
    cubeCamera.position.set(0, 0, 8).applyQuaternion(camera.quaternion);
    cubeRenderer.render(cubeScene, cubeCamera);
  }

  const TURN_MS = 300;
  let turn = null;

  function lookFrom(direction) {
    // Spend whatever drag momentum is left now, so it can't nudge the
    // camera off the chosen view once the turn ends.
    controls.enableDamping = false;
    controls.update();
    controls.enableDamping = true;
    const end = direction.clone().normalize();
    // OrbitControls can't look exactly along the up axis, so tilt the top and
    // bottom views a hair towards the front.
    if (Math.abs(end.y) > 0.999) end.set(0, Math.sign(end.y), 1e-3).normalize();
    const start = camera.position.clone().sub(controls.target).normalize();
    turn = {
      start,
      rotation: new THREE.Quaternion().setFromUnitVectors(start, end),
      began: performance.now(),
    };
  }

  function stepTurn(now) {
    const t = Math.min((now - turn.began) / TURN_MS, 1);
    const eased = t * (2 - t);
    const direction = turn.start.clone()
      .applyQuaternion(new THREE.Quaternion().slerp(turn.rotation, eased));
    const distance = camera.position.distanceTo(controls.target);
    camera.position.copy(controls.target).addScaledVector(direction, distance);
    camera.lookAt(controls.target);
    if (t === 1) turn = null;
  }

  // --- files -----------------------------------------------------------------

  const loader = new STLLoader();
  let files = [];
  let shown = null; // { path, modified } of the file on screen
  let loading = null;

  function fileUrl(file) {
    const path = file.path.split("/").map(encodeURIComponent).join("/");
    return `/viewer/files/${path}?v=${file.modified}`;
  }

  async function open(file) {
    const refit = shown?.path !== file.path;
    shown = { path: file.path, modified: file.modified };
    loading = file.path;
    renderList();
    try {
      const response = await fetch(fileUrl(file), { cache: "no-store" });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      const geometry = toCreasedNormals(loader.parse(await response.arrayBuffer()), CREASE_ANGLE);
      if (loading === file.path) show(geometry, refit);
    } catch (error) {
      if (loading === file.path) info.textContent = `Could not load ${file.path}: ${error.message}`;
    }
  }

  function renderList() {
    list.replaceChildren();
    if (files.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "No STL files yet. They appear here when export_stl writes one.";
      list.append(empty);
      return;
    }
    for (const file of files) {
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("aria-current", String(file.path === shown?.path));
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = file.path;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent =
        `${(file.bytes / 1024).toFixed(1)} KiB · ` +
        new Date(file.modified * 1000).toLocaleString();
      button.append(name, meta);
      button.addEventListener("click", () => {
        follow.checked = file === files[0];
        open(file);
      });
      const item = document.createElement("li");
      item.append(button);
      list.append(item);
    }
  }

  let listed = "";
  async function poll() {
    try {
      const response = await fetch("/viewer/files", { cache: "no-store" });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      const text = await response.text();
      if (text !== listed) {
        listed = text;
        files = JSON.parse(text);
        renderList();
        const current = files.find((file) => file.path === shown?.path);
        if (follow.checked && files.length > 0 &&
            (files[0].path !== shown?.path || files[0].modified !== shown?.modified)) {
          await open(files[0]);
        } else if (current && current.modified !== shown.modified) {
          await open(current); // overwritten in place: reload, keep the camera
        }
      }
    } catch (error) {
      info.textContent = `Could not list files: ${error.message}`;
    } finally {
      setTimeout(poll, POLL_MS);
    }
  }

  // --- controls --------------------------------------------------------------

  wireframeButton.addEventListener("click", () => {
    material.wireframe = !material.wireframe;
    wireframeButton.setAttribute("aria-pressed", String(material.wireframe));
  });
  document.getElementById("reset").addEventListener("click", frame);
  follow.addEventListener("change", () => {
    if (follow.checked && files.length > 0) open(files[0]);
  });

  poll();
</script>
</body>
</html>
