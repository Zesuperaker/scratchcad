[project]
name = "scratchcad-mcp"
version = "0.1.0"
description = "MCP server exposing the scratchcad HTTP API as tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.14.*"
dependencies = [
    "fastmcp==4.0.10",
    "httpx2==2.13.1",
    "starlette==1.7.0",
]

[project.scripts]
scratchcad-mcp = "scratchcad_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scratchcad_mcp"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = ["integration: needs a real scratchcad binary (skipped when it is not built)"]

[tool.coverage.run]
source = ["scratchcad_mcp"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
